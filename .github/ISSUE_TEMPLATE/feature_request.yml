name: Feature request
description: Suggest a new capability or API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Props, callbacks or CSS variables you have in mind. New behavior should be opt-in.
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
