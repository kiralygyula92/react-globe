name: Publish

# Publishes packages/globe to npm when a GitHub release is published. The release tag must be
# v<version> of packages/globe/package.json.
#
# Authentication is npm trusted publishing once the package has this workflow as its trusted
# publisher on npmjs.com; no secret is needed then. Until that is set up, an NPM_TOKEN repository
# secret is used instead.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./packages/globe/package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match packages/globe version v$VERSION"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older npm.
      - run: npm install --global npm@11
      # prepublishOnly runs the typecheck, the tests and the build.
      - run: npm publish --provenance --access public
        working-directory: packages/globe
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
