name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only GitHub-made actions may run in this repository, so pnpm (the version in package.json's
# `packageManager`) is installed with the runner's npm rather than with pnpm/action-setup.
# The `build` job id is the status check the main branch ruleset requires: keep it, and give the
# job no `name`, or the check reports under the new name and pull requests wait forever.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @kingtech/react-globe pack --dry-run
      - run: pnpm docs:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm docs:demos
