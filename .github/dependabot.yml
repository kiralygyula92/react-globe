version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 removes options this repository's configurations still use (`baseUrl` in the
      # docs demos' tsconfig), so TypeScript majors are adopted deliberately, together with those
      # changes, rather than by an automated pull request.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node type definitions track the Node version the repo runs, so that code cannot use APIs
      # the runtime does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
